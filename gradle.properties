org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Set by the release workflow so version code/name can be bumped without touching files.
VERSION_CODE=1
VERSION_NAME=1.0.0

# The Gradle distribution is downloaded on every fresh CI run; the default 10s
# connect timeout is too tight and made builds fail intermittently.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
