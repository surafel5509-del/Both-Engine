name: Probe

on:
  workflow_dispatch:
  push:
    branches: [arena/d50b25a3-both-engine]

permissions:
  contents: read

jobs:
  env:
    name: Probe runner environment
    runs-on: ubuntu-latest
    steps:
      - name: Show environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version 2>&1 || true
          which sdkmanager || true
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || true
          echo "IMAGE_VER=$ImageVersion"
