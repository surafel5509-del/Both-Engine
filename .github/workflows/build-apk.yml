name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a release APK'
        type: boolean
        default: false
      publish_release:
        description: 'Attach the APKs to a GitHub Release'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Both Engine APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "Android SDK: $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Resolve version info
        id: version
        shell: bash
        run: |
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        if: always()
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Collect debug APK
        id: apk
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No debug APK was produced"
            exit 1
          fi
          OUT="BothEngine-${{ steps.version.outputs.name }}-debug.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "### Both Engine APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | ${{ steps.version.outputs.name }} |"
            echo "| Commit | ${{ steps.version.outputs.sha }} |"
            echo "| Size | $(du -h "$OUT" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -d "${ANDROID_SDK_ROOT}/build-tools/"* 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/aapt2" ]; then
            "$BUILD_TOOLS/aapt2" dump badging "${{ steps.apk.outputs.path }}" | head -n 8
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BothEngine-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode signing keystore
        id: keystore
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured - release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SUPPLY_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "SUPPLY_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SUPPLY_KEY_ALIAS=$KEY_ALIAS"
            echo "SUPPLY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_release || inputs.publish_release }}
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect release APK
        id: release_apk
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_release || inputs.publish_release }}
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            OUT="BothEngine-${{ steps.version.outputs.name }}-release-signed.apk"
          else
            OUT="BothEngine-${{ steps.version.outputs.name }}-release-unsigned.apk"
          fi
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_release || inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: BothEngine-release-apk
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${{ steps.version.outputs.sha }}"
          fi

          {
            echo "Automated build of **Both Engine**."
            echo ""
            echo "- Version: \`${{ steps.version.outputs.name }}\`"
            echo "- Commit: \`${{ steps.version.outputs.sha }}\`"
            echo "- Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "Install with \`adb install <file>.apk\` or sideload on Android 7.0+ (OpenGL ES 2.0)."
          } > notes.md

          ASSETS=("${{ steps.apk.outputs.path }}")
          if [ -n "${{ steps.release_apk.outputs.path }}" ]; then
            ASSETS+=("${{ steps.release_apk.outputs.path }}")
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Both Engine ${{ steps.version.outputs.name }}" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
