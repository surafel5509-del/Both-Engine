name: App Smoke Test

# Boots an Android emulator, installs the APK, launches the app and asserts it
# stays alive. Captures the crash trace when it does not.
on:
  workflow_dispatch:
  push:
    branches: [main, master, arena/0161a3aa-both-engine]
    paths:
      - 'app/**'
      - '.github/workflows/emulator-smoke-test.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Launch app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the runner's Android SDK
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -uo pipefail
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
            adb install -r -t "$APK"

            adb logcat -c
            adb shell am start -W -n com.bothengine.game/.GameActivity || true
            sleep 12

            PID=$(adb shell pidof com.bothengine.game | tr -d '\r')
            adb logcat -d > logcat.txt || true
            adb shell dumpsys activity activities > activities.txt 2>/dev/null || true

            echo "### Smoke test" >> "$GITHUB_STEP_SUMMARY"
            echo "- APK: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- pid after 12s: \`${PID:-<none>}\`" >> "$GITHUB_STEP_SUMMARY"

            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "### Crash trace" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              adb logcat -d | sed -n '/FATAL EXCEPTION/,/^$/p' | head -n 80 >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              adb logcat -d | sed -n '/FATAL EXCEPTION/,/^$/p' | head -n 25 | \
                while IFS= read -r line; do echo "::error title=Crash::$line"; done
              exit 1
            fi

            if [ -z "$PID" ]; then
              echo "::error title=Crash::App process is not running after launch"
              adb logcat -d | grep -E "AndroidRuntime|bothengine|ActivityManager: Start proc|Displayed" | tail -n 60 || true
              exit 1
            fi

            echo "::notice title=Smoke test::App launched and is running (pid $PID)"
            adb logcat -d | grep -E "Displayed com.bothengine|GameActivity|EngineApplication" | head -n 20 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            logcat.txt
            activities.txt
          if-no-files-found: ignore
          retention-days: 7
