name: App Smoke Test

# Boots an Android emulator, installs the APK, launches the app and asserts it
# stays alive. Any crash trace is published to the run summary and annotations.
on:
  workflow_dispatch:
  push:
    branches: [main, master, arena/0161a3aa-both-engine]
    paths:
      - 'app/**'
      - '.github/workflows/emulator-smoke-test.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Launch app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the runner's Android SDK
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch the app
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
            echo "APK=$APK" > smoke.env
            echo "INSTALL_BEGIN" >> smoke.env
            adb install -r -t "$APK" >> smoke.env 2>&1 || true
            echo "INSTALL_END" >> smoke.env
            adb logcat -c || true
            # Stream from BEFORE the launch: the crash can happen within milliseconds
            # and would otherwise be evicted from the ring buffer.
            (adb logcat -v threadtime > logcat.txt 2>&1 &) || true
            sleep 2
            adb shell am start -W -n com.bothengine.game/.GameActivity > am-start.txt 2>&1 || true
            cat am-start.txt >> smoke.env
            sleep 15
            echo "PID=$(adb shell pidof com.bothengine.game | tr -d '\r')" >> smoke.env
            pkill -f "adb logcat" || true
            adb logcat -d >> logcat.txt 2>/dev/null || true
            adb shell dumpsys activity activities > activities.txt 2>/dev/null || true
            cat smoke.env
            true

      - name: Report smoke test result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "### Smoke test" >> "$GITHUB_STEP_SUMMARY"

          # Fall back to the emulator step's own log if the script never ran.
          if [ ! -f smoke.env ]; then
            echo "::error title=Smoke test::The emulator script did not run to completion"
            echo "- emulator script did not start" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cat smoke.env >> "$GITHUB_STEP_SUMMARY" || true
          PID="$(sed -n 's/^PID=//p' smoke.env | tr -d '\r')"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- pid after 15s: \`${PID:-<none>}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -f logcat.txt ]; then
            CRASH="$(sed -n '/FATAL EXCEPTION/,/^$/p' logcat.txt | head -n 60)"
            if [ -n "$CRASH" ]; then
              {
                echo "### Crash trace"
                echo '```'
                echo "$CRASH"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "$CRASH" | head -n 20 | while IFS= read -r line; do
                echo "::error title=Crash::$line"
              done
              exit 1
            fi
            # ANR / native crash fallbacks
            if grep -qE "ANR in com.bothengine|Fatal signal" logcat.txt; then
              echo "### Fatal signal / ANR" >> "$GITHUB_STEP_SUMMARY"
              grep -E "ANR in com.bothengine|Fatal signal|backtrace" logcat.txt | head -n 10 | \
                while IFS= read -r line; do echo "::error title=Crash::$line"; done
              exit 1
            fi
          fi

          # Install diagnostics: a failed install also leaves no process behind.
          INSTALL="$(sed -n '/INSTALL_BEGIN/,/INSTALL_END/p' smoke.env)"
          if printf '%s' "$INSTALL" | grep -qi "failure"; then
            echo "### Install failed" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$INSTALL" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$INSTALL" | while IFS= read -r line; do
              echo "::error title=Install::$line"
            done
            exit 1
          fi

          if [ -z "$PID" ]; then
            echo "::error title=Smoke test::App process is not running after launch"
            # Everything that can explain a dead process, app-scoped only.
            RELEVANT="$(grep -E "com\.bothengine|bothengine|AndroidRuntime|FATAL EXCEPTION|am_crash|am_proc_died|ActivityManager.*(died|crash)|ActivityTaskManager.*bothengine|libc.*bothengine" logcat.txt 2>/dev/null | tail -n 40)"
            if [ -n "$RELEVANT" ]; then
              {
                echo "### Why the app stopped"
                echo '```'
                printf '%s\n' "$RELEVANT"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' "$RELEVANT" | head -n 15 | while IFS= read -r line; do
                echo "::error title=App stopped::$line"
              done
            else
              echo "::error title=App stopped::No app-specific log found; see smoke.env below"
            fi
            echo "### smoke.env" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat smoke.env >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            # am start output tells us whether the activity resolved at all.
            if [ -f am-start.txt ]; then
              head -n 12 am-start.txt | while IFS= read -r line; do
                echo "::error title=am start::$line"
              done
            fi
            # The first app-scoped lines usually hold the cause.
            grep -E "com\.bothengine|AndroidRuntime" logcat.txt 2>/dev/null | head -n 12 | \
              while IFS= read -r line; do echo "::error title=Log::$line"; done || true
            exit 1
          fi

          echo "::notice title=Smoke test::App launched and is running (pid $PID)"
          grep -E "Displayed com.bothengine|GameActivity|EngineApplication" logcat.txt 2>/dev/null | head -n 12 | \
            while IFS= read -r line; do echo "::notice title=App log::$line"; done || true
