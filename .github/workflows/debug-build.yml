name: Debug Build

on:
  workflow_dispatch:
  push:
    branches: [arena/d50b25a3-both-engine]

permissions:
  contents: write

jobs:
  build:
    name: Debug build with reporting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report environment
        shell: bash
        run: |
          set +e
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version 2>&1
            ls "$ANDROID_SDK_ROOT" 2>/dev/null
            ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null
            ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null
            which sdkmanager
            env | grep -i -E "android|java|gradle" | sort
          } > /tmp/env.txt 2>&1 || true

      - name: Build
        shell: bash
        id: build
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > /tmp/build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=/tmp/report.txt
          { echo "EXIT: ${{ steps.build.outputs.exit }}"; echo "=== ENV ==="; cat /tmp/env.txt; echo "=== BUILD (tail) ==="; tail -n 400 /tmp/build.log 2>/dev/null; } > $OUT
          head -c 60000 $OUT > /tmp/report-trim.txt
          python3 - <<'PY'
          import json
          body = open('/tmp/report-trim.txt').read()
          json.dump({"body": "```\n" + body + "\n```"}, open('/tmp/comment.json','w'))
          PY
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/comment.json --jq '.id' || echo "comment failed"
          tail -n 40 /tmp/build.log 2>/dev/null || true
