name: Debug Build

on:
  workflow_dispatch:
  push:
    branches: [arena/d50b25a3-both-engine]

permissions:
  contents: write

jobs:
  build:
    name: Debug build with reporting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report environment
        shell: bash
        run: |
          set +e
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version 2>&1
            ls "$ANDROID_SDK_ROOT" 2>/dev/null
            ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null
            ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null
            which sdkmanager
            env | grep -i -E "android|java|gradle" | sort
          } > /tmp/env.txt 2>&1 || true

      - name: Build
        shell: bash
        id: build
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > /tmp/build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        shell: bash
        run: |
          OUT=/tmp/report.txt
          {
            echo "EXIT: ${{ steps.build.outputs.exit }}"
            echo "=== ERROR COUNT: $(grep -c 'error:' /tmp/build.log 2>/dev/null) ==="
            echo "=== UNIQUE ERRORS ==="
            grep 'error:' /tmp/build.log 2>/dev/null | sed 's#/home/runner/work/Both-Engine/Both-Engine/##' | sort -u
            echo "=== FAILURE LINES ==="
            grep -E '^\* What went wrong|^> Task .* FAILED|^e: |^Caused by' -A3 /tmp/build.log 2>/dev/null | tail -n 60
          } > $OUT

          python3 - <<'PYEOF'
          import json, subprocess, os
          body = open('/tmp/report.txt', errors='replace').read()
          chunks = [body[i:i+50000] for i in range(0, len(body), 50000)] or ['(empty report)']
          repo = os.environ['GH_REPO']
          sha = os.environ['GH_SHA']
          for idx, c in enumerate(chunks[:12], 1):
              payload = {"body": f"**[report {idx}/{len(chunks)}]**\n```\n{c}\n```"}
              open('/tmp/c.json','w').write(json.dumps(payload))
              subprocess.run(["gh","api","-X","POST",f"repos/{repo}/commits/{sha}/comments",
                              "--input","/tmp/c.json","--jq",".id"], check=False)
          print(f"posted {min(len(chunks),12)} chunk(s)")
          PYEOF
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
