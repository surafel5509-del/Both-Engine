name: CI Build

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Compile and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Report lint summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Build summary"
            echo ""
            echo "- Gradle: \`$(./gradlew --version 2>/dev/null | grep '^Gradle' | head -n1)\`"
            echo "- APK: $(du -h app/build/outputs/apk/debug/*.apk 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BothEngine-debug-apk-ci
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
