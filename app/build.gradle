// Both Engine - Main Application Module

plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv("VERSION_CODE") ?: project.findProperty("VERSION_CODE") ?: "1").toInteger()
def ciVersionName = System.getenv("VERSION_NAME") ?: project.findProperty("VERSION_NAME") ?: "1.0.0"

android {
    namespace 'com.bothengine'

    compileSdk 34

    defaultConfig {
        applicationId "com.bothengine.game"
        minSdk 24
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the CI keystore when SUPPLY_KEYSTORE_* secrets are configured,
            // otherwise left unsigned and CI falls back to the debug APK.
            if (System.getenv("SUPPLY_STORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    signingConfigs {
        release {
            if (System.getenv("SUPPLY_STORE_FILE") != null) {
                storeFile file(System.getenv("SUPPLY_STORE_FILE"))
                storePassword System.getenv("SUPPLY_STORE_PASSWORD")
                keyAlias System.getenv("SUPPLY_KEY_ALIAS")
                keyPassword System.getenv("SUPPLY_KEY_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'

    // OpenGL ES is part of the Android platform (android.opengl.*), no artifact needed.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
